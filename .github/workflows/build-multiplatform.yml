name: Test on multiple compiler and OS platforms

on:
    push:
        branches: [ "main", "openmp-52", "openmp-60" ]
    pull_request:
        branches: [ "main", "openmp-52", "openmp-60" ]

jobs:
    job_ubuntu-26-clang:
        runs-on: ubuntu-latest
        container: ubuntu:26.04
        steps:
            - uses: actions/checkout@v4
            - run: apt-get update && apt-get upgrade -y
            - run: apt-get install -y clang libomp-dev cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_ubuntu-24-clang:
        runs-on: ubuntu-latest
        container: ubuntu:24.04
        steps:
            - uses: actions/checkout@v4
            - run: apt-get update && apt-get upgrade -y
            - run: apt-get install -y clang libomp-dev cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_ubuntu-22-clang:
        runs-on: ubuntu-latest
        container: ubuntu:22.04
        steps:
            - uses: actions/checkout@v4
            - run: export DEBIAN_FRONTEND=noninteractive
            - run: export TZ=Etc/UTC
            - run: apt-get update && apt-get upgrade -y
            - run: apt-get install -y clang libomp-dev cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_debian-13-clang:
        runs-on: ubuntu-latest
        container: debian:13
        steps:
            - uses: actions/checkout@v4
            - run: apt-get update && apt-get upgrade -y
            - run: apt-get install -y clang libomp-dev cmake build-essential
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_debian-12-clang:
        runs-on: ubuntu-latest
        container: debian:12
        steps:
            - uses: actions/checkout@v4
            - run: apt-get update && apt-get upgrade -y
            - run: apt-get install -y clang libomp-dev cmake build-essential
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_debian-sid-clang:
        runs-on: ubuntu-latest
        container: debian:sid
        steps:
            - uses: actions/checkout@v4
            - run: apt-get update && apt-get upgrade -y
            - run: apt-get install -y clang libomp-dev cmake build-essential
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_almalinux-9-clang:
        runs-on: ubuntu-latest
        container: almalinux:9
        steps:
            - uses: actions/checkout@v4
            - run: dnf update -y
            - run: dnf install -y clang cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_almalinux-10-clang:
        runs-on: ubuntu-latest
        container: almalinux:10
        steps:
            - uses: actions/checkout@v4
            - run: dnf update -y
            - run: dnf install -y clang cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_rockylinux-9-clang:
        runs-on: ubuntu-latest
        container: rockylinux/rockylinux:9
        steps:
            - uses: actions/checkout@v4
            - run: dnf update -y
            - run: dnf install -y clang cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_rockylinux-10-clang:
        runs-on: ubuntu-latest
        container: rockylinux/rockylinux:10
        steps:
            - uses: actions/checkout@v4
            - run: dnf update -y
            - run: dnf install -y clang cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_fedora-44-clang:
        runs-on: ubuntu-latest
        container: fedora:44
        steps:
          - uses: actions/checkout@v4
          - run: dnf update -y
          - run: dnf install -y clang cmake
          - uses: ./.github/actions/build-and-test-ompt-printf
            with:
              compiler-toolchain: Clang   
    job_fedora-43-clang:
        runs-on: ubuntu-latest
        container: fedora:43
        steps:
            - uses: actions/checkout@v4
            - run: dnf update -y
            - run: dnf install -y clang cmake
            - uses: ./.github/actions/build-and-test-ompt-printf
              with:
                compiler-toolchain: Clang
    job_fedora-rawhide-clang:
        runs-on: ubuntu-latest
        container: fedora:rawhide
        steps:
          - uses: actions/checkout@v4
          - run: dnf update -y
          - run: dnf install -y clang cmake
          - uses: ./.github/actions/build-and-test-ompt-printf
            with:
              compiler-toolchain: Clang
    job_opensuse-leap-16-clang:
        runs-on: ubuntu-latest
        container: opensuse/leap:16.0
        steps:
          - run: zypper update -y
          - run: zypper install -y --type pattern devel_basis
          - run: zypper install -y clang cmake libstdc++-devel libomp-devel tar gzip
          - uses: actions/checkout@v4
          - uses: ./.github/actions/build-and-test-ompt-printf
            with:
              compiler-toolchain: Clang
    job_archlinux-clang:
        runs-on: ubuntu-latest
        container: archlinux:latest
        steps:
          - uses: actions/checkout@v4
          - run: pacman -Syu --noconfirm
          - run: pacman -S --noconfirm clang openmp llvm cmake make
          - uses: ./.github/actions/build-and-test-ompt-printf
            with:
              compiler-toolchain: Clang
    job_intel-oneapi-2026-1-0:
        runs-on: ubuntu-latest
        container: intel/oneapi:2026.1.0-devel-ubuntu26.04
        steps:
          - uses: actions/checkout@v4
          - run: rm -f /etc/apt/sources.list.d/oneAPI.list /etc/apt/sources.list.d/intel-graphics.list
          - run: apt-get update -y
          - run: apt-get install -y cmake
          - uses: ./.github/actions/build-and-test-ompt-printf
            with:
              compiler-toolchain: oneAPI
    job_intel-oneapi-2026-0-0:
        runs-on: ubuntu-latest
        container: intel/oneapi:2026.0.0-devel-ubuntu24.04
        steps:
          - uses: actions/checkout@v4
          - run: rm -f /etc/apt/sources.list.d/oneAPI.list /etc/apt/sources.list.d/intel-graphics.list
          - run: apt-get update -y
          - run: apt-get install -y cmake
          - uses: ./.github/actions/build-and-test-ompt-printf
            with:
              compiler-toolchain: oneAPI
    job_intel-oneapi-2025-3-1:
        runs-on: ubuntu-latest
        container: intel/oneapi:2025.3.1-0-devel-ubuntu24.04
        steps:
          - uses: actions/checkout@v4
          - run: rm -f /etc/apt/sources.list.d/oneAPI.list /etc/apt/sources.list.d/intel-graphics.list
          - run: apt-get update -y
          - run: apt-get install -y cmake
          - uses: ./.github/actions/build-and-test-ompt-printf
            with:
              compiler-toolchain: oneAPI
